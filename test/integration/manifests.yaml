# Test objects for the ek9 integration tests.
# All objects are in the namespace ek9-itest of the kind cluster
# ek9-itest.  The secret has a dummy value, not a real secret.
apiVersion: v1
kind: Namespace
metadata:
  name: ek9-itest
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: ek9-itest
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      initContainers:
        - name: init
          image: busybox:1.36
          command: ["true"]
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: ek9-itest
spec:
  selector: { app: web }
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: ek9-itest
spec:
  replicas: 1
  serviceName: db
  selector:
    matchLabels: { app: db }
  template:
    metadata:
      labels: { app: db }
    spec:
      containers:
        - name: db
          image: nginx:1.27-alpine
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: agent
  namespace: ek9-itest
spec:
  selector:
    matchLabels: { app: agent }
  template:
    metadata:
      labels: { app: agent }
    spec:
      containers:
        - name: agent
          image: busybox:1.36
          command: ["sleep", "infinity"]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tick
  namespace: ek9-itest
spec:
  schedule: "0 0 1 1 *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: tick
              image: busybox:1.36
              command: ["echo", "tick"]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: settings
  namespace: ek9-itest
data:
  mode: blue
---
apiVersion: v1
kind: Secret
metadata:
  name: creds
  namespace: ek9-itest
stringData:
  user: dummy-user
---
apiVersion: v1
kind: Pod
metadata:
  name: crasher
  namespace: ek9-itest
spec:
  restartPolicy: Always
  containers:
    - name: crasher
      image: busybox:1.36
      command: ["sh", "-c", "echo crash; exit 1"]
---
# Objects for the discovered built-in types.  The HPA and the PDB use
# names that do not exist, so that they do not change the workloads of
# the other tests.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ek9-reader
  namespace: ek9-itest
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: reader
  namespace: ek9-itest
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: reader
  namespace: ek9-itest
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: reader
subjects:
  - kind: ServiceAccount
    name: ek9-reader
    namespace: ek9-itest
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: ek9-itest
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Mi
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: ek9-itest
spec:
  rules:
    - host: web.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web
  namespace: ek9-itest
spec:
  podSelector:
    matchLabels:
      app: web
  policyTypes: ["Ingress"]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: none
  namespace: ek9-itest
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ek9-none
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: none
  namespace: ek9-itest
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ek9-none
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: pods
  namespace: ek9-itest
spec:
  hard:
    pods: "50"
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: ek9-itest-low
value: 10
description: Priority class for the ek9 integration tests.
