name: release

on:
  push:
    branches: [main]

concurrency: cicada-release

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: boenan/cicada@v0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
